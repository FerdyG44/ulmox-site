name: Deploy production website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build production site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      NODE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Validate production analytics configuration
        shell: bash
        run: |
          if [[ -z "${GA_MEASUREMENT_ID:-}" ]]; then
            echo "::error title=Missing GA4 configuration::Set the repository variable GA_MEASUREMENT_ID before deploying production."
            exit 1
          fi

          if [[ ! "${GA_MEASUREMENT_ID}" =~ ^G-[A-Z0-9]{4,20}$ ]] || [[ "${GA_MEASUREMENT_ID}" =~ ^G-X+$ ]]; then
            echo "::error title=Invalid GA4 configuration::GA_MEASUREMENT_ID must be a real GA4 Measurement ID in G-... format."
            exit 1
          fi

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run syntax checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Verify production artifact
        run: npm run verify:dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy production site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
